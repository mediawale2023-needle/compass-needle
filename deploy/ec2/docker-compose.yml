services:
  backend:
    build:
      context: /opt/compass-needle/app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/compass-needle/.env
    environment:
      PORT: "8000"
      ENV: production
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/compass-needle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

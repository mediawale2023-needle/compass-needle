# Railway monorepo config
# Backend service uses the root Dockerfile (already deployed).
# Frontend service uses frontend/Dockerfile — set "Root Directory" to "frontend/"
# in the Railway dashboard when creating the second service.

[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

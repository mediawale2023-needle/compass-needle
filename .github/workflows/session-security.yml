name: Session Security PostgreSQL

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: needle_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d needle_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TZ: Asia/Kolkata
      DATABASE_URL: sqlite:///./session_bootstrap.db
      PILOT_SESSION_TEST_POSTGRES_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/needle_phase1_test
      JWT_SECRET: synthetic-session-tests-secret-at-least-32-chars
      ADMIN_JWT_SECRET: synthetic-admin-tests-secret-at-least-32-chars
      OPENAI_API_KEY: test-only
      GEMINI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Test revocation and concurrent support consumption
        run: python -m pytest tests/test_pilot_session_security.py -q

name: Trace WhatsApp Message End To End

# Manually triggered, STRICTLY READ-ONLY. Traces recent inbound traffic for
# one WhatsApp number through the full V1 path:
#
#   Meta webhook -> wa_inbound_messages -> tenant resolution -> text buffer
#   -> cases -> the exact /api/cases visibility filter -> outbound reply
#
# Use after sending a real text message to the number, to prove the message
# actually lands on the intended tenant's dashboard rather than trusting a
# config row. Writes nothing.
#
# Note: citizen texts are debounced (WA_TEXT_BUFFER_FLUSH_SECONDS, default
# 35s) before a case is created, so allow ~60s after sending before running.
#
# Logs are public: sender phones print as last-4, Meta message IDs and
# Phone Number IDs as tails plus exact-match booleans.

on:
  workflow_dispatch:
    inputs:
      display_number:
        description: "Receiver number as the resolver sees it, e.g. +91XXXXXXXXXX"
        required: true
      tenant_id:
        description: "Tenant ID that must own the resulting case"
        required: true
      phone_number_id:
        description: "Meta Phone Number ID the outbound reply must use"
        required: true
      minutes:
        description: "How far back to look, in minutes"
        required: true
        default: "30"

concurrency:
  group: aws-ec2-backend-diagnostics
  cancel-in-progress: false

jobs:
  trace:
    name: Trace recent messages for one number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-south-1
      EC2_SECURITY_GROUP_ID: sg-0a434a0dc0c6d3424

    steps:
      - name: Validate Inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ inputs.display_number }}" | grep -qE '^\+[0-9]{8,15}$' \
            || { echo "display_number must be E.164 with a leading +"; exit 1; }
          echo "${{ inputs.tenant_id }}" | grep -qE '^[0-9]{1,9}$' \
            || { echo "tenant_id must be digits only"; exit 1; }
          echo "${{ inputs.phone_number_id }}" | grep -qE '^[0-9]{5,25}$' \
            || { echo "phone_number_id must be digits only"; exit 1; }
          echo "${{ inputs.minutes }}" | grep -qE '^[0-9]{1,5}$' \
            || { echo "minutes must be digits only"; exit 1; }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow SSH From GitHub Runner
        id: ssh_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions trace-wa-message'}]" \
            || echo "SSH ingress may already exist for this runner IP; continuing."

      - name: Trace Over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NUM: ${{ inputs.display_number }}
          TID: ${{ inputs.tenant_id }}
          PNID: ${{ inputs.phone_number_id }}
          MINS: ${{ inputs.minutes }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 8m
          envs: NUM,TID,PNID,MINS
          script: |
            set -euo pipefail
            COMPOSE=/opt/compass-needle/deploy/ec2/docker-compose.yml
            SQLFILE=/tmp/trace_wa_$$.sql
            trap 'rm -f "$SQLFILE"' EXIT

            cat > "$SQLFILE" <<EOF
            \\echo '== STAGE 0: registered staff/PA phones for this tenant =='
            \\echo '   Staff messages route to the case-query engine or PA letter'
            \\echo '   intake, so they get a reply but NEVER create a case. An'
            \\echo '   unlinked ledger row from one of these is expected, not a fault.'
            SELECT id, username, role, is_active,
                   '***'||RIGHT(REGEXP_REPLACE(COALESCE(phone,''), '[^0-9]', '', 'g'), 4) AS phone_tail
            FROM users
            WHERE tenant_id = ${TID} AND phone IS NOT NULL
            ORDER BY id;

            \\echo ''
            \\echo '== STAGE 0b: unlinked inbound rows — staff sender or genuine loss? =='
            SELECT w.id,
                   '***'||RIGHT(w.sender_phone,4) AS sender,
                   w.message_type,
                   w.status,
                   EXISTS (
                     SELECT 1 FROM users u
                     WHERE u.tenant_id = ${TID} AND u.is_active = true AND u.phone IS NOT NULL
                       AND RIGHT(REGEXP_REPLACE(u.phone, '[^0-9]', '', 'g'), 10)
                           = RIGHT(REGEXP_REPLACE(w.sender_phone, '[^0-9]', '', 'g'), 10)
                   ) AS sender_is_staff,
                   w.last_received_at
            FROM wa_inbound_messages w
            WHERE w.receiver_number = '${NUM}'
              AND w.case_id IS NULL
              AND w.last_received_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY w.id DESC;

            \\echo ''
            \\echo '== STAGE 1-3: webhook -> wa_inbound_messages -> tenant resolution =='
            SELECT id,
                   '...'||RIGHT(meta_message_id, 18) AS meta_msg_id_tail,
                   tenant_id,
                   (tenant_id = ${TID}) AS tenant_is_target,
                   '***'||RIGHT(sender_phone,4) AS sender,
                   message_type,
                   status,
                   case_id,
                   last_error,
                   last_received_at
            FROM wa_inbound_messages
            WHERE receiver_number = '${NUM}'
              AND last_received_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY id DESC
            LIMIT 20;

            \\echo ''
            \\echo '== STAGE 4: text buffer (citizen texts debounce ~35s before a case) =='
            SELECT id, tenant_id, '***'||RIGHT(sender_phone,4) AS sender, status,
                   jsonb_array_length(messages) AS msg_count,
                   first_message_at, last_message_at
            FROM wa_text_buffer
            WHERE last_message_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY id DESC
            LIMIT 20;

            \\echo ''
            \\echo '== STAGE 5: resulting cases (linked from the ledger rows above) =='
            SELECT c.id, c.tenant_id,
                   (c.tenant_id = ${TID}) AS tenant_is_target,
                   '***'||RIGHT(c.user_phone,4) AS phone,
                   c.category, c.status,
                   LENGTH(c.raw_message) AS msg_len,
                   COALESCE(c.is_deleted,false) AS is_deleted,
                   c.created_at
            FROM cases c
            WHERE c.id IN (
              SELECT case_id FROM wa_inbound_messages
              WHERE receiver_number = '${NUM}'
                AND last_received_at > NOW() - INTERVAL '${MINS} minutes'
                AND case_id IS NOT NULL
            )
            ORDER BY c.id DESC;

            \\echo ''
            \\echo '== STAGE 5b: ANY case for this tenant in the window (catches unlinked) =='
            SELECT id, tenant_id, '***'||RIGHT(user_phone,4) AS phone,
                   category, status, COALESCE(is_deleted,false) AS is_deleted, created_at
            FROM cases
            WHERE tenant_id = ${TID}
              AND created_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY id DESC
            LIMIT 20;

            \\echo ''
            \\echo '== STAGE 6: /api/cases visibility — exact filter from api_router.py:1793 =='
            \\echo '   (tenant scope + not-deleted + default all_cases exclude_status)'
            SELECT c.id, c.status, c.category, c.created_at,
                   'VISIBLE ON DASHBOARD' AS verdict
            FROM cases c
            WHERE c.tenant_id = ${TID}
              AND (c.is_deleted = false OR c.is_deleted IS NULL)
              AND c.status NOT IN ('resolved','completed','closed')
              AND c.created_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY c.id DESC
            LIMIT 20;

            \\echo ''
            \\echo '== STAGE 7: outbound reply + the Phone Number ID actually used =='
            SELECT id, tenant_id, case_id,
                   '***'||RIGHT(to_number,4) AS to_num,
                   COALESCE('***'||RIGHT(phone_number_id,4),'(null)') AS pnid_tail,
                   (phone_number_id = '${PNID}') AS pnid_is_target,
                   status, attempt_count, last_error, sent_at, created_at
            FROM wa_outbound_messages
            WHERE created_at > NOW() - INTERVAL '${MINS} minutes'
            ORDER BY id DESC
            LIMIT 20;
            EOF

            docker compose -f "$COMPOSE" exec -T postgres sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' < "$SQLFILE"

      - name: Remove GitHub Runner SSH Access
        if: always() && steps.ssh_ip.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ip.outputs.runner_ip }}/32}]" \
            || true

name: Production Checks

# Manual, read-only checks of the production host:
#  - config:        report production settings (secrets only as set / not set)
#  - restore-drill: fresh verified backup -> restore into a throwaway database ->
#                   compare row counts -> drop it; the result is appended to
#                   /opt/compass-needle/backups/restore_drills.log and printed here.
# Neither check changes production data, containers or settings.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Which check to run"
        type: choice
        options: [config, restore-drill]
        default: config

concurrency:
  group: aws-ec2-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Run ${{ inputs.check }} on production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      EC2_SECURITY_GROUP_ID: sg-0a434a0dc0c6d3424
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow SSH From GitHub Runner
        id: ssh_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions production check'}]" \
            || echo "SSH ingress may already exist for this runner IP; continuing."

      - name: Run Check Over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -e
            bash /opt/compass-needle/app/deploy/ec2/production_checks.sh "${{ inputs.check }}"

      - name: Remove GitHub Runner SSH Access
        if: always() && steps.ssh_ip.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ip.outputs.runner_ip }}/32}]" \
            || true

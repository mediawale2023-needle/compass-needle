name: Diagnose Govt Sync Portal Resolution

# Manually triggered read-only diagnostic for "tenant sees the wrong (or
# CPGRAMS-fallback) government portal" and "Escalate says department list
# isn't configured" reports. Prints tenant_profiles.state, the govt_portals
# rows that would/wouldn't match it (including whether department_taxonomy
# is actually populated), optionally all rows for any state substring, and
# the tenant's most recent govt_* case state — nothing beyond that. No writes.

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Tenant ID to check"
        required: true
        default: "10"
      state_filter:
        description: "State substring to also list all govt_portals rows for (blank to skip)"
        required: false
        default: ""

concurrency:
  group: aws-ec2-backend-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect tenant_profiles.state + govt_portals matching
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-south-1
      EC2_SECURITY_GROUP_ID: sg-0a434a0dc0c6d3424

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow SSH From GitHub Runner
        id: ssh_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions diagnose'}]" \
            || echo "SSH ingress may already exist for this runner IP; continuing."

      - name: Diagnose Over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          STATE_FILTER: ${{ inputs.state_filter }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 8m
          envs: TENANT_ID,STATE_FILTER
          script: |
            set -euo pipefail
            COMPOSE=/opt/compass-needle/deploy/ec2/docker-compose.yml

            # Write the SQL to a file on the remote host first — far less error-prone
            # than escaping single-quoted SQL through two more layers of shell quoting.
            cat > /tmp/diagnose_govt_sync.sql <<SQL
            \pset border 2
            \echo == tenant_profiles row (state drives portal resolution) ==
            SELECT tenant_id, constituency, state, length(state) AS state_len, octet_length(state) AS state_bytes
            FROM tenant_profiles WHERE tenant_id = ${TENANT_ID};

            \echo == govt_portals rows matching this tenant state via LOWER(), same compare the resolver uses ==
            SELECT gp.id, gp.state, gp.portal_name, gp.active, gp.is_primary, (gp.base_url IS NOT NULL) AS has_url,
                   (gp.department_taxonomy IS NOT NULL AND gp.department_taxonomy::text <> '{}') AS has_taxonomy
            FROM govt_portals gp
            WHERE LOWER(gp.state) = LOWER((SELECT state FROM tenant_profiles WHERE tenant_id = ${TENANT_ID}));

            \echo == ALL govt_portals rows matching state_filter (blank = skipped below), catches typo/whitespace/casing ==
            SELECT id, state, length(state) AS state_len, portal_name, active, is_primary, live_session_supported,
                   (department_taxonomy IS NOT NULL AND department_taxonomy::text <> '{}') AS has_taxonomy,
                   department_taxonomy
            FROM govt_portals WHERE '${STATE_FILTER}' <> '' AND state ILIKE '%${STATE_FILTER}%';

            \echo == this tenant's 5 most recent cases with a govt_status set ==
            SELECT id, govt_status, govt_portal_id, govt_department
            FROM cases WHERE tenant_id = ${TENANT_ID} AND govt_status IS NOT NULL AND govt_status <> 'not_forwarded'
            ORDER BY id DESC LIMIT 5;
            SQL

            docker compose -f "$COMPOSE" cp /tmp/diagnose_govt_sync.sql postgres:/tmp/diagnose_govt_sync.sql
            docker compose -f "$COMPOSE" exec -T postgres sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /tmp/diagnose_govt_sync.sql'
            docker compose -f "$COMPOSE" exec -T postgres rm -f /tmp/diagnose_govt_sync.sql
            rm -f /tmp/diagnose_govt_sync.sql

      - name: Remove GitHub Runner SSH Access
        if: always() && steps.ssh_ip.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ip.outputs.runner_ip }}/32}]" \
            || true

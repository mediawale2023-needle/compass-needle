name: Deploy Backend To AWS EC2
run-name: Deploy backend @ ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character commit SHA to deploy (must be tested and contained in main)"
        required: true
        type: string

concurrency:
  group: aws-ec2-backend-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Production Revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      target_sha: ${{ steps.revision.outputs.target_sha }}
    steps:
      - name: Checkout Main History
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Target Revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

          TARGET_SHA="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          git fetch --no-tags origin main
          git cat-file -e "${TARGET_SHA}^{commit}"

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing deployment: $TARGET_SHA is not contained in origin/main." >&2
            exit 1
          fi

          PRODUCT_TESTS_STATE="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Backend, Frontend, Admin, And Browser Tests")] | {total: length, unsuccessful: map(select(.status != "completed" or .conclusion != "success")) | length}'
          )"
          PRODUCT_TESTS_TOTAL="$(jq -r '.total' <<< "$PRODUCT_TESTS_STATE")"
          PRODUCT_TESTS_UNSUCCESSFUL="$(jq -r '.unsuccessful' <<< "$PRODUCT_TESTS_STATE")"
          if [[ "$PRODUCT_TESTS_TOTAL" -lt 1 ]]; then
            echo "Refusing deployment: $TARGET_SHA has no Product Tests check." >&2
            exit 1
          fi
          if [[ "$PRODUCT_TESTS_UNSUCCESSFUL" -ne 0 ]]; then
            echo "Refusing deployment: $TARGET_SHA has failed, cancelled, or pending Product Tests checks." >&2
            exit 1
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deployment revision"
            echo
            echo "Validated commit: \`$TARGET_SHA\`"
            echo "Source: manually supplied, contained in \`main\`, Product Tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Pull Latest Code And Restart Backend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_SECURITY_GROUP_ID: sg-0a434a0dc0c6d3424
      EC2_INSTANCE_ID: i-0224cc2edb8c7dc2b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow SSH From GitHub Runner
        id: ssh_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions deploy'}]" \
            || echo "SSH ingress may already exist for this runner IP; continuing."

      - name: Ensure EC2 SSH Is Reachable
        shell: bash
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          set -euo pipefail

          check_ssh() {
            for attempt in {1..6}; do
              if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
                return 0
              fi
              echo "SSH not reachable yet (attempt ${attempt}/6); waiting..."
              sleep 10
            done
            return 1
          }

          if check_ssh; then
            echo "SSH is reachable."
            exit 0
          fi

          echo "SSH is not reachable; rebooting EC2 instance ${EC2_INSTANCE_ID}..."
          aws ec2 reboot-instances --region "$AWS_REGION" --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-status-ok --region "$AWS_REGION" --instance-ids "$EC2_INSTANCE_ID"

          echo "Instance checks passed after reboot; waiting for SSH..."
          for attempt in {1..12}; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
              echo "SSH is reachable after reboot."
              exit 0
            fi
            echo "SSH still unavailable after reboot (attempt ${attempt}/12); waiting..."
            sleep 10
          done

          echo "SSH did not become reachable after reboot." >&2
          exit 1

      - name: Deploy Over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: TARGET_SHA
          script: |
            set -e
            cd /opt/compass-needle/app
            git fetch origin main
            git reset --hard "$TARGET_SHA"
            sudo apt-get update -y
            sudo apt-get install -y cron
            if ! command -v aws >/dev/null 2>&1; then
              ARCH="$(uname -m)"
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}.zip" -o /tmp/awscliv2.zip
              sudo apt-get install -y unzip
              unzip -q -o /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi
            sudo install -d -m 0755 /opt/compass-needle/scripts /opt/compass-needle/backups
            sudo chown -R ubuntu:ubuntu /opt/compass-needle/scripts /opt/compass-needle/backups
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/backup_postgres_to_s3.sh /opt/compass-needle/scripts/backup_postgres_to_s3.sh
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/restore_postgres_backup.sh /opt/compass-needle/scripts/restore_postgres_backup.sh
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/install_backup_cron.sh /opt/compass-needle/scripts/install_backup_cron.sh
            /opt/compass-needle/scripts/install_backup_cron.sh || true
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/install_jobs_cron.sh /opt/compass-needle/scripts/install_jobs_cron.sh
            /opt/compass-needle/scripts/install_jobs_cron.sh || true
            sudo install -m 0644 /opt/compass-needle/app/deploy/ec2/Caddyfile /opt/compass-needle/Caddyfile
            # docker-compose.yml lives outside the git checkout at a fixed host path
            # (referenced by every `-f` below) but was never synced from the repo on
            # deploy — install it the same way Caddyfile is, so compose-file changes
            # (e.g. adding a service) actually take effect instead of silently running
            # against a stale copy.
            sudo install -d -m 0755 /opt/compass-needle/deploy/ec2
            sudo install -m 0644 /opt/compass-needle/app/deploy/ec2/docker-compose.yml /opt/compass-needle/deploy/ec2/docker-compose.yml
            docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml up -d --build backend backend_govt_live
            docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml up -d --force-recreate caddy
            docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml ps
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}

      - name: Verify Backend Health
        shell: bash
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS https://api.theneedle.in/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi
            echo "Backend health check not ready (attempt ${attempt}/12); waiting..."
            sleep 10
          done
          echo "api.theneedle.in is not publicly healthy yet; checking backend through the EC2 Caddy route."
          if curl -fsS --resolve "backend.coinmedia.co.in:443:${EC2_HOST}" https://backend.coinmedia.co.in/health; then
            echo
            echo "Backend app is healthy on EC2. Public api.theneedle.in DNS/TLS may still be pending."
            exit 0
          fi
          echo "Backend did not pass health check after deploy." >&2
          exit 1

      - name: Record Deployed Revision
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          {
            echo "## Deployment completed"
            echo
            echo "Deployed and health-checked commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove GitHub Runner SSH Access
        if: always() && steps.ssh_ip.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ip.outputs.runner_ip }}/32}]" \
            || true

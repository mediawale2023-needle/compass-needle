name: Deploy Backend To AWS EC2

# Production deploys only run for a commit whose "Product Tests" run passed:
#  - automatically, when Product Tests completes successfully on main;
#  - manually (workflow_dispatch), after the same check for the commit being deployed.
# Only the current tip of main is deployed; an older commit whose tests finish late
# is skipped (the newer commit deploys itself). The host skips the rebuild when no
# backend file changed since the commit it is running.
on:
  workflow_run:
    workflows: ["Product Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-ec2-backend-production
  cancel-in-progress: false

jobs:
  gate:
    name: Require Passing Tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check Product Tests And Tip Of Main
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_run" ]]; then
            sha="$RUN_SHA"
            if [[ "$RUN_CONCLUSION" != "success" ]]; then
              echo "::warning::Product Tests concluded '$RUN_CONCLUSION' for $sha — not deploying."
              echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          fi
          passed="$(gh api "repos/$REPO/actions/workflows/product-tests.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')"
          if [[ "$passed" == "0" ]]; then
            echo "::error::No successful Product Tests run for $sha — refusing to deploy."
            exit 1
          fi
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [[ "$tip" != "$sha" ]]; then
            echo "::notice::$sha is no longer the tip of main ($tip); the newer commit deploys after its own tests."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Tests passed for $sha; deploying."
          echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Pull Latest Code And Restart Backend
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      EC2_SECURITY_GROUP_ID: sg-0a434a0dc0c6d3424
      EC2_INSTANCE_ID: i-0224cc2edb8c7dc2b
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow SSH From GitHub Runner
        id: ssh_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Actions deploy'}]" \
            || echo "SSH ingress may already exist for this runner IP; continuing."

      - name: Ensure EC2 SSH Is Reachable
        shell: bash
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          set -euo pipefail

          check_ssh() {
            for attempt in {1..6}; do
              if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
                return 0
              fi
              echo "SSH not reachable yet (attempt ${attempt}/6); waiting..."
              sleep 10
            done
            return 1
          }

          if check_ssh; then
            echo "SSH is reachable."
            exit 0
          fi

          echo "SSH is not reachable; rebooting EC2 instance ${EC2_INSTANCE_ID}..."
          aws ec2 reboot-instances --region "$AWS_REGION" --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-status-ok --region "$AWS_REGION" --instance-ids "$EC2_INSTANCE_ID"

          echo "Instance checks passed after reboot; waiting for SSH..."
          for attempt in {1..12}; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
              echo "SSH is reachable after reboot."
              exit 0
            fi
            echo "SSH still unavailable after reboot (attempt ${attempt}/12); waiting..."
            sleep 10
          done

          echo "SSH did not become reachable after reboot." >&2
          exit 1

      - name: Deploy Over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -e
            cd /opt/compass-needle/app
            DEPLOY_SHA="${{ needs.gate.outputs.sha }}"
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            # Rebuild only when a backend file changed since the commit the host was running.
            BACKEND_PATHS="Dockerfile requirements.txt main.py api_router.py admin_api.py partner_api.py core modules sansadx_backend jobs scripts data deploy/ec2 tenant_overrides.json package.json package-lock.json"
            if git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null && [ -z "$(git diff --name-only "$PREVIOUS_SHA" "$DEPLOY_SHA" -- $BACKEND_PATHS)" ]; then
              BACKEND_CHANGED=0
              echo "No backend changes since ${PREVIOUS_SHA}; containers are left running."
            else
              BACKEND_CHANGED=1
            fi
            sudo apt-get update -y
            sudo apt-get install -y cron
            if ! command -v aws >/dev/null 2>&1; then
              ARCH="$(uname -m)"
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}.zip" -o /tmp/awscliv2.zip
              sudo apt-get install -y unzip
              unzip -q -o /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi
            sudo install -d -m 0755 /opt/compass-needle/scripts /opt/compass-needle/backups
            sudo chown -R ubuntu:ubuntu /opt/compass-needle/scripts /opt/compass-needle/backups
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/backup_postgres_to_s3.sh /opt/compass-needle/scripts/backup_postgres_to_s3.sh
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/restore_postgres_backup.sh /opt/compass-needle/scripts/restore_postgres_backup.sh
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/install_backup_cron.sh /opt/compass-needle/scripts/install_backup_cron.sh
            /opt/compass-needle/scripts/install_backup_cron.sh
            sudo install -m 0755 /opt/compass-needle/app/deploy/ec2/install_jobs_cron.sh /opt/compass-needle/scripts/install_jobs_cron.sh
            /opt/compass-needle/scripts/install_jobs_cron.sh || true
            sudo install -m 0644 /opt/compass-needle/app/deploy/ec2/Caddyfile /opt/compass-needle/Caddyfile
            # docker-compose.yml lives outside the git checkout at a fixed host path
            # (referenced by every `-f` below) but was never synced from the repo on
            # deploy — install it the same way Caddyfile is, so compose-file changes
            # (e.g. adding a service) actually take effect instead of silently running
            # against a stale copy.
            sudo install -d -m 0755 /opt/compass-needle/deploy/ec2
            sudo install -m 0644 /opt/compass-needle/app/deploy/ec2/docker-compose.yml /opt/compass-needle/deploy/ec2/docker-compose.yml
            if [ "$BACKEND_CHANGED" = "1" ]; then
              docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml up -d --build backend backend_govt_live
              docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml up -d --force-recreate caddy
            fi
            docker compose -f /opt/compass-needle/deploy/ec2/docker-compose.yml ps
            # Settings report (secrets only as set / not set) in every deploy log.
            bash /opt/compass-needle/app/deploy/ec2/production_checks.sh config || echo "WARNING: production settings report failed"
            # Re-prove backup and restore whenever the backup tooling itself changes.
            if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null || [ -n "$(git diff --name-only "$PREVIOUS_SHA" "$DEPLOY_SHA" -- deploy/ec2/backup_postgres_to_s3.sh deploy/ec2/restore_postgres_backup.sh deploy/ec2/install_backup_cron.sh deploy/ec2/production_checks.sh)" ]; then
              bash /opt/compass-needle/app/deploy/ec2/production_checks.sh restore-drill || echo "WARNING: RESTORE DRILL FAILED — see output above"
            fi

      - name: Verify Backend Health
        shell: bash
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS https://api.theneedle.in/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi
            echo "Backend health check not ready (attempt ${attempt}/12); waiting..."
            sleep 10
          done
          echo "api.theneedle.in is not publicly healthy yet; checking backend through the EC2 Caddy route."
          if curl -fsS --resolve "backend.coinmedia.co.in:443:${EC2_HOST}" https://backend.coinmedia.co.in/health; then
            echo
            echo "Backend app is healthy on EC2. Public api.theneedle.in DNS/TLS may still be pending."
            exit 0
          fi
          echo "Backend did not pass health check after deploy." >&2
          exit 1

      - name: Remove GitHub Runner SSH Access
        if: always() && steps.ssh_ip.outputs.runner_ip != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ssh_ip.outputs.runner_ip }}/32}]" \
            || true

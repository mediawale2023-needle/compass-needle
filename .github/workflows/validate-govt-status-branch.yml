name: Temporary Govt Status Branch Validation

on:
  push:
    branches:
      - Codex/govt-status-diagnostics-20260909

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENV: test
      DATABASE_URL: sqlite:///./ci_govt_status_validation.db
      JWT_SECRET: ci-test-secret-key-32-characters-minimum-ok
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      GEMINI_API_KEY: test-gemini-key
      META_APP_SECRET: test-meta-app-secret
      META_ACCESS_TOKEN: test-meta-access-token
      META_VERIFY_TOKEN: test-meta-verify-token
      META_PHONE_NUMBER_ID: '15551636821'
      WHATSAPP_PHONE_NUMBER_ID: '15551636821'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install pytest
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Focused Tamil Nadu frontend tests
        run: npm run test --prefix frontend -- --run tests/briefcase-tamil-nadu-session.test.jsx
      - name: Full frontend test suite
        run: npm run test --prefix frontend
      - name: Build MP frontend
        run: npm run build --prefix frontend
      - name: GovtSync regression selection
        run: venv/bin/python -m pytest tests/ -k "govt or karnataka or maharashtra or rajasthan or tamil" -q

# Temporary branch-only workflow. Delete before PR/merge.

name: Product Tests

on:
  push:
    branches:
      - main
      - "Codex/**"
  pull_request:
    branches:
      - main

jobs:
  test-all:
    name: Backend, Frontend, Admin, And Browser Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      # Throwaway PostgreSQL for the opt-in real-PostgreSQL regression tests (SQLite hid the
      # partner overview integer assigned_to defect).
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEEDLE_PARTNER_PG_URL: postgresql://postgres:ci@localhost:5432/ci
      # Real-PostgreSQL suites (erasure, Delhi reference race, tenant 9). Separate
      # databases: the lifecycle race test drops and recreates its own tables.
      NEEDLE_PG_TEST_URL: postgresql://postgres:ci@localhost:5432/ci_pg
      NEEDLE_LIFECYCLE_PG_URL: postgresql://postgres:ci@localhost:5432/ci_lifecycle
      ENV: test
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET: ci-test-secret-key-32-characters-minimum-ok
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      GEMINI_API_KEY: test-gemini-key
      META_APP_SECRET: test-meta-app-secret
      META_ACCESS_TOKEN: test-meta-access-token
      META_VERIFY_TOKEN: test-meta-verify-token
      META_PHONE_NUMBER_ID: "15551636821"
      WHATSAPP_PHONE_NUMBER_ID: "15551636821"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PostgreSQL Test Databases
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U postgres -d ci -c "CREATE DATABASE ci_pg"
          psql -h localhost -U postgres -d ci -c "CREATE DATABASE ci_lifecycle"

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          # Test-only dependency: kept out of requirements.txt so the
          # production Docker image does not carry it.
          venv/bin/pip install pytest

      - name: Install Root Node Dependencies
        run: npm ci

      - name: Install MP Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Install Admin Frontend Dependencies
        run: npm ci --prefix admin

      - name: Install Playwright Browser
        working-directory: frontend
        # Retried once: the browser download is a network fetch that intermittently fails on runners.
        run: npx playwright install --with-deps chromium || (sleep 20 && npx playwright install --with-deps chromium)

      - name: Run Full Product Test Suite
        run: npm run test:all

      # Builds fetch Google Fonts over the network (next/font); retry once on a transient fetch failure.
      - name: Build MP Frontend
        run: npm run build:mp || (sleep 15 && npm run build:mp)

      - name: Build Admin Frontend
        run: npm run build:admin || (sleep 15 && npm run build:admin)
